name: examples-it

# Runs the Ideas Board example's integration tests on GitHub-hosted runners,
# which ship with Docker — so Testcontainers spins up a real CockroachDB and the
# tutorial's integration tests (the 40001 concurrency proof, follower reads,
# metrics, CDC) actually execute. Multi-region and vector ITs stay gated: they
# need a multi-region cluster / a v25.2+ image (added in follow-up jobs).
on:
  pull_request:
    paths:
      - 'examples/ideas-board/**'
      - '.github/workflows/examples-it.yml'
  push:
    branches: [main]
    paths:
      - 'examples/ideas-board/**'
      - '.github/workflows/examples-it.yml'
  workflow_dispatch:

jobs:
  ideas-board-it:
    name: Ideas Board integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/ideas-board/go.mod
      - name: Integration tests (real CockroachDB via Testcontainers)
        working-directory: examples/ideas-board
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test ./... -v -timeout 15m

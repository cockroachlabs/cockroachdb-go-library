# 3-node insecure CockroachDB cluster for the Ideas Board multi-region IT.
#
# Each node declares a distinct --locality=region, so the cluster exposes three
# regions (us-east1, us-west1, us-central1). The one-shot `crdb-init` service runs
# `cockroach init` and then makes `defaultdb` multi-region, which is what
# multiregion_it_test.go expects (it SKIPs unless the regions already exist).
#
# Only node1's SQL port is published to the host:
#   CRDB_URL=postgres://root@localhost:26257/defaultdb?sslmode=disable
#
# Local use:
#   docker compose -f multiregion-compose.yml up -d crdb-us-east1 crdb-us-west1 crdb-us-central1
#   docker compose -f multiregion-compose.yml run --rm crdb-init
#   CRDB_MULTIREGION=true CRDB_URL=postgres://root@localhost:26257/defaultdb?sslmode=disable \
#     go test ./... -run Regional -v
#
# In-memory stores + capped caches keep three nodes light enough for a CI runner.
# Every SQL call sets a statement_timeout and a connect timeout so a cluster that
# never reaches quorum FAILS the init (with node status dumped) instead of hanging.
# ponytail: single node per region (RF=3 across 3 nodes), not 3-per-region zone
# survival — enough to prove region-homed writes; scale up only if survival goals
# are what you're testing.

name: crdb-multiregion-it

x-crdb: &crdb
  image: cockroachdb/cockroach:latest-v25.1
  restart: "no"

services:
  crdb-us-east1:
    <<: *crdb
    hostname: crdb-us-east1
    command: start --insecure --store=type=mem,size=512MiB --cache=256MiB --max-sql-memory=256MiB --advertise-addr=crdb-us-east1 --join=crdb-us-east1,crdb-us-west1,crdb-us-central1 --locality=region=us-east1
    ports:
      - "26257:26257"

  crdb-us-west1:
    <<: *crdb
    hostname: crdb-us-west1
    command: start --insecure --store=type=mem,size=512MiB --cache=256MiB --max-sql-memory=256MiB --advertise-addr=crdb-us-west1 --join=crdb-us-east1,crdb-us-west1,crdb-us-central1 --locality=region=us-west1

  crdb-us-central1:
    <<: *crdb
    hostname: crdb-us-central1
    command: start --insecure --store=type=mem,size=512MiB --cache=256MiB --max-sql-memory=256MiB --advertise-addr=crdb-us-central1 --join=crdb-us-east1,crdb-us-west1,crdb-us-central1 --locality=region=us-central1

  # One-shot: initialize the cluster, wait for all three regions to join, then make
  # defaultdb multi-region. Every cockroach call is time-bounded (--connect-timeout
  # + SET statement_timeout) and every loop is iteration-bounded, so this service
  # always terminates: exit 0 on success, exit 1 (after dumping node status) if the
  # cluster never becomes a healthy 3-region cluster.
  crdb-init:
    <<: *crdb
    depends_on:
      - crdb-us-east1
      - crdb-us-west1
      - crdb-us-central1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -u
        host=crdb-us-east1
        # 1) initialize the cluster (first reachable node); returns fast if refused.
        for i in $$(seq 1 30); do
          cockroach init --insecure --host="$$host" 2>/tmp/init.err && { echo "cluster initialized"; break; }
          grep -q "already been initialized" /tmp/init.err && { echo "cluster already initialized"; break; }
          cat /tmp/init.err; echo "init attempt $$i failed, retrying"; sleep 2
        done
        # 2) wait until all three region localities are visible cluster-wide.
        for i in $$(seq 1 40); do
          count=$$(cockroach sql --insecure --host="$$host" --connect-timeout=5 --format=csv \
            -e "SET statement_timeout='15s'; SELECT count(DISTINCT region) FROM [SHOW REGIONS FROM CLUSTER]" 2>/tmp/reg.err | tail -n1)
          echo "attempt $$i distinct_regions=$$count"
          [ "$$count" = "3" ] && { echo "all 3 regions present"; break; }
          cat /tmp/reg.err 2>/dev/null || true
          sleep 3
        done
        # 3) make defaultdb multi-region (idempotent). statement_timeout stops a
        #    schema change that cannot make progress from hanging the loop.
        for i in $$(seq 1 20); do
          if cockroach sql --insecure --host="$$host" --connect-timeout=5 -e "
            SET statement_timeout='30s';
            ALTER DATABASE defaultdb SET PRIMARY REGION 'us-east1';
            ALTER DATABASE defaultdb ADD REGION IF NOT EXISTS 'us-west1';
            ALTER DATABASE defaultdb ADD REGION IF NOT EXISTS 'us-central1';
          "; then
            echo "defaultdb is multi-region:"
            cockroach sql --insecure --host="$$host" --connect-timeout=5 -e "SHOW REGIONS FROM DATABASE defaultdb"
            exit 0
          fi
          echo "region config attempt $$i failed, retrying"; sleep 3
        done
        echo "FAILED to configure multi-region defaultdb; node status:"
        cockroach node status --insecure --host="$$host" --connect-timeout=5 || true
        exit 1
